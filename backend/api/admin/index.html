<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevBits Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/static/admin.css" />
  </head>
  <body class="admin-login-page">
    <div class="admin-atmosphere" aria-hidden="true"></div>

    <main class="login-shell">
      <section class="login-card reveal reveal-1">
        <img class="login-logo" src="/Devbits_Icons.png" alt="DevBits logo" />
        <h1 class="login-title">DevBits</h1>
        <p class="login-caption">Admin Console</p>
        <p class="login-subtitle">Sign in with your admin account or Administrator key.</p>

        <form id="signin-form" class="login-form" novalidate>
          <label class="sr-only" for="username-input">Username</label>
          <input
            id="username-input"
            class="admin-input"
            placeholder="Username or Administrator"
            autocomplete="username"
            required
          />

          <label class="sr-only" for="password-input">Password</label>
          <div class="password-row">
            <input
              id="password-input"
              class="admin-input"
              type="password"
              placeholder="Password or admin key"
              autocomplete="current-password"
              required
            />
            <button type="button" id="password-toggle" class="flat-btn" aria-label="Show password">
              Show
            </button>
          </div>

          <button id="sign-in" type="submit" class="btn btn--primary">
            <span>Sign in</span>
          </button>
        </form>

        <div id="status" class="login-status" aria-live="polite"></div>
      </section>
    </main>

    <script src="/admin/static/login.js"></script>
  </body>
</html>
