<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevBits Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

<link rel="stylesheet" href="/admin/static/admin.css" />

  </head>
  <body class="admin-login-page">
    <svg
      style="display: none; position: absolute"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <filter
          id="glass-distort"
          x="-10%"
          y="-10%"
          width="120%"
          height="120%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.65 0.65"
            numOctaves="1"
            seed="2"
            result="noise"
          />
          <feGaussianBlur in="noise" stdDeviation="1.5" result="blurred" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="blurred"
            scale="8"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div class="admin-atmosphere" aria-hidden="true"></div>

    <main class="login-shell">
      <section class="login-card">
        <img class="login-logo reveal reveal-1" src="/Devbits_Icons.png" alt="DevBits logo" />
        <h1 class="login-title reveal reveal-2">DevBits</h1>
        <p class="login-caption reveal reveal-3">Sign in to ship bytes.</p>
        <p class="login-subtitle reveal reveal-4">Admin Console</p>

        <form id="signin-form" class="login-form" novalidate>
          <label class="sr-only" for="username-input">Username</label>
          <input
            id="username-input"
            class="admin-input reveal reveal-5"
            placeholder="Username or Administrator"
            autocomplete="username"
          />

          <label class="sr-only" for="password-input">Password</label>
          <div class="password-row reveal reveal-6">
            <input
              id="password-input"
              class="admin-input"
              type="password"
              placeholder="Password / Admin key"
              autocomplete="current-password"
            />
            <button type="button" id="password-toggle" class="flat-btn" aria-label="Show password">
              Show
            </button>
          </div>

class="btn btn--primary reveal reveal-7">
            <span>Sign in</span>
          </button>
        </form>

        <div id="status" class="login-status" aria-live="polite"></div>
      </section>
    </main>

    <script src="/admin/static/login.js"></script>
  </body>
</html>
